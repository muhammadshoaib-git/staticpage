trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
- group: 'New variable group 11-Sep'

stages:

# ============================================================
# STAGE 1: VALIDATE
# ============================================================
- stage: Validate
  displayName: 'Validate Build'

  jobs:
  - job: ValidateWebsite
    displayName: 'Validate Static Website'

    steps:

    - checkout: self

    - script: |
        echo "Checking website files..."
        echo "Repository: $(Build.SourcesDirectory)"

        if [ ! -f "$(Build.SourcesDirectory)/index.html" ]; then
          echo "ERROR: index.html was not found."
          exit 1
        fi

        echo "index.html found successfully."
        echo "Website validation completed successfully."

      displayName: 'Validate Website'


# ============================================================
# STAGE 2: DEPLOY
# ============================================================
- stage: Deploy
  displayName: 'Deploy to Azure Static Web App'

  dependsOn: Validate
  condition: succeeded()

  jobs:
  - job: DeployWebsite
    displayName: 'Deploy Website'

    steps:

    - checkout: self

    - task: AzureStaticWebApp@0
      displayName: 'Deploy to Azure Static Web App'
      inputs:
        app_location: '/'
        output_location: ''
        skip_app_build: true
        skip_api_build: true
        azure_static_web_apps_api_token: '$(AZURE_STATIC_WEB_APPS_API_TOKEN)'
